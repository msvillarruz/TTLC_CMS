name: Deploy CMS to Coolify

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/deploy-cms.yml'

jobs:
  test:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    name: Deploy via Coolify Webhook
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          # --fail: a 401/404 from Coolify must fail the job, not pass silently.
          # Short connect timeout: an unreachable host fails in seconds, not minutes.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
      - name: Health check
        run: |
          sleep 60
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -m 10 -w "%{http_code}" https://cms.tinythinkers.edu.ph/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Deploy successful"
              exit 0
            fi
            echo "Attempt $i: health check returned $STATUS, retrying in 15s"
            sleep 15
          done
          echo "Health check failed: $STATUS"
          exit 1
